<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base Background -->
  <rect width="64" height="64" rx="16" fill="#09090b"/>
  <!-- Inner Glow & Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#glowGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Monogram Logo -->
  <text x="32" y="41" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-0.5">IR</text>
  <!-- Accent Dot -->
  <circle cx="48" cy="22" r="3" fill="#34d399"/>
</svg>
